[workspace]
resolver = "3"
members = ["crates/hummr-core", "crates/hummr-cli", "crates/hummr-tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Abinav Pallathoor"]
repository = "https://github.com/AbinavPallathoor/Hummr"

[workspace.dependencies]
hummr-core = { path = "crates/hummr-core" }
hummr-tui = { path = "crates/hummr-tui" }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
hound = "3.5.1"
insta = "1.49.0"
midly = "0.5.3"
realfft = "3.5.0"
thiserror = "2.0.21"

# DSP code is painfully slow unoptimised; keep debug builds and tests usable.
[profile.dev.package.hummr-core]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
